# Layout of the welding cell. Metres / degrees.
# World frame = robot base frame (robot stands on the floor at the origin, facing +X).
# The same file generates the Gazebo world and the MoveIt collision scene (single source of truth).

table:
  center: [1.15, 0.0]      # x, y of the table centre
  size: [0.90, 1.10]       # x, y
  height: 0.75             # top surface above the floor
  top_thickness: 0.04

# Workpiece: suspension bracket / body reinforcement made of 4 mm steel sheet:
# base plate + vertical rib (two fillet welds) + bushing tube (circumferential fillet weld).
part:
  xyz: [1.10, 0.0, 0.754]  # part frame = centre of the base plate top face (table top + plate)
  yaw: 0.0
  plate: [0.40, 0.30, 0.004]                                      # x, y, thickness
  rib: {y: 0.07, length: 0.26, height: 0.08, thickness: 0.004}    # rib along X at y
  tube: {x: 0.0, y: -0.07, radius: 0.035, height: 0.06}           # vertical tube

fixture:
  clamp_size: [0.05, 0.03, 0.04]
  pin_radius: 0.008

fence: {x_min: -1.3, x_max: 2.1, y_half: 1.8, height: 2.0}
