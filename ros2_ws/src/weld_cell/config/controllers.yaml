controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Servo model of the simulated joints: gz_ros2_control turns the position command into a
# velocity command v = gain * error * update_rate (gain 1.0 = ideal, lower = softer servo).
gz_ros2_control:
  ros__parameters:
    position_proportional_gain: 0.5

joint_trajectory_controller:
  ros__parameters:
    joints: [j1, j2, j3, j4, j5, j6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0
      j1: { trajectory: 0.2, goal: 0.05 }
      j2: { trajectory: 0.2, goal: 0.05 }
      j3: { trajectory: 0.2, goal: 0.05 }
      j4: { trajectory: 0.2, goal: 0.05 }
      j5: { trajectory: 0.2, goal: 0.05 }
      j6: { trajectory: 0.2, goal: 0.05 }
